<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Alisio Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider">ALISIO<span
                    class="text-blue-300">TECH</span></a>
            <div class="space-x-6 hidden md:block">
                <a href="index.html" class="hover:text-blue-300 transition">Inicio</a>
                <a href="servicios.html" class="hover:text-blue-300 transition">Servicios</a>
                <a href="proyectos.html" class="hover:text-blue-300 transition">Proyectos</a>
                <a href="nosotros.html" class="hover:text-blue-300 transition">Nosotros</a>
                <a href="contacto.html" class="text-blue-300 border-b-2 border-blue-300 pb-1">Contacto</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-12 flex justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full border-t-4 border-blue-900">
            <h2 class="text-2xl font-bold text-blue-900 mb-6">Solicita tu presupuesto</h2>
            <form onsubmit="event.preventDefault(); alert('Formulario simulado enviado correctamente.');">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Nombre o Empresa</label>
                    <input type="text"
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Correo Electrónico</label>
                    <input type="email"
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-700 mb-2">¿En qué podemos ayudarte?</label>
                    <textarea rows="4"
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required></textarea>
                </div>

                <!-- Guiño a la asignatura de Normativa -->
                <div class="mb-6 flex items-start">
                    <input type="checkbox" id="rgpd" class="mt-1 mr-2" required>
                    <label for="rgpd" class="text-xs text-slate-500">
                        He leído y acepto la <a href="#" class="text-blue-600 underline">Política de Privacidad</a>.
                        Consiento el tratamiento de mis datos personales según el RGPD vigente.
                    </label>
                </div>

                <button type="submit"
                    class="w-full bg-blue-700 text-white font-bold py-2 px-4 rounded hover:bg-blue-800 transition">Enviar
                    Consulta</button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center">
        <p>&copy; 2026 Alisio Tech. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
